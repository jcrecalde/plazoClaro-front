<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar | PlazoClaro</title>
  <link rel="stylesheet" href="./css/styles.css?v=53" />
</head>
<body>

  <header class="navbar">
    <div class="container navbar-content">
      <a href="./auth.html" class="logo">Plazo<span>Claro</span></a>

      <nav class="nav-links">
        <a href="./auth.html" class="active">Ingresar</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Ingresar a PlazoClaro</h1>
        <p>
          Accedé a tu espacio de trabajo para gestionar causas, plazos y vencimientos judiciales.
        </p>
      </div>
    </section>

    <section class="container calculator-layout">
      <form id="loginForm" class="form-card">
        <span class="badge">Iniciar sesión</span>

        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="tuemail@estudio.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="loginPassword">Contraseña</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="Tu contraseña"
            required
          />
        </div>

        <div class="result-actions">
          <button type="submit" class="btn btn-primary" id="loginBtn">
            Ingresar
          </button>
        </div>
      </form>

      <form id="registerForm" class="form-card">
        <span class="badge">Crear cuenta</span>

        <div class="form-group">
          <label for="registerFullName">Nombre</label>
          <input
            type="text"
            id="registerFullName"
            placeholder="Ej: Juan Recalde"
          />
        </div>

        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input
            type="email"
            id="registerEmail"
            placeholder="tuemail@estudio.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="registerPassword">Contraseña</label>
          <input
            type="password"
            id="registerPassword"
            placeholder="Mínimo 6 caracteres"
            required
          />
          <small class="field-help">
            Para esta versión inicial, usá una contraseña de al menos 6 caracteres.
          </small>
        </div>

        <div class="result-actions">
          <button type="submit" class="btn btn-secondary" id="registerBtn">
            Crear cuenta
          </button>
        </div>
      </form>
    </section>

    <section class="container">
      <div id="authMessage" class="notice hidden"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      PlazoClaro © 2026 — Control operativo de plazos judiciales.
    </div>
  </footer>

  <script src="./js/auth.js?v=1"></script>
</body>
</html>
